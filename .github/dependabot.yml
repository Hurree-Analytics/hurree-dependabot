---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directory: "/javascript"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: bundler
    directory: "/ruby"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
